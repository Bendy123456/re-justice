<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b13">
  <meta name="description" content="Play Shattered Accord, an original browser fighting game. Challenge the CPU, pick a fighter, and customize your controls. Early access prototype.">
  <title>Shattered Accord — Free Browser Fighting Game</title>
  <style>
    :root{color-scheme:dark;font-family:Impact,Haettenschweiler,'Arial Narrow Bold',system-ui,sans-serif}
    *{box-sizing:border-box} html,body{height:100%;margin:0;overflow:hidden;background:#060910;color:#fff}
    #screen{width:100vw;height:100dvh;display:flex;align-items:center;justify-content:center;padding:0;position:relative}
    #game{display:block;width:min(100vw,177.7778vh);height:min(100vh,56.25vw);object-fit:contain;background:#080d19;outline:none;touch-action:none}
    #status{position:absolute;bottom:9px;right:12px;color:#8b95ad;font:11px Arial,sans-serif;pointer-events:none;letter-spacing:0.2px}
    @media(max-height:550px){#status{display:none}}
  </style>
</head>
<body>
  <div id="screen"><canvas id="game" width="1280" height="720" tabindex="0" aria-label="Shattered Accord browser fighting game"></canvas><span id="status">EARLY ACCESS · 1V1 VS BOT</span></div>
  <script src="assets.js"></script>
  <script src="characters.js"></script>
  <script src="stages.js"></script>
  <script src="audio.js"></script>
  <script src="input.js"></script>
  <script src="ai.js"></script>
  <script src="engine.js"></script>
  <script src="ui.js"></script>
</body>
</html>
