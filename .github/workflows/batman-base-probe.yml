name: Inspect CC0 humanoid base
on:
  push:
    branches: [batman-blender-asset]
    paths: ['.github/workflows/batman-base-probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batman-blender-asset
      - name: Install Blender tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy
      - name: Download verified CC0 Quaternius-derived human base
        run: |
          mkdir -p blender/resources
          curl -fL --retry 3 --max-time 60 -o blender/resources/cc0_humanoid.glb https://raw.githubusercontent.com/programasweights/avatar/main/public/assets/character.glb
          test -s blender/resources/cc0_humanoid.glb
      - name: Inspect imported mesh
        run: blender -b -t 2 --python-exit-code 1 --python blender/probe_cc0.py | tail -100
      - name: Commit geometry metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/batman/CC0_BASE_INFO.json
          git commit -m "Probe CC0 human mesh and rig dimensions [skip ci]"
          git push origin HEAD:batman-blender-asset
