name: Build tall light-gray stone slabs and grassy Blender arena
on:
  push:
    branches: [main]
    paths:
      - 'blender/build_training_arena.py'
      - 'blender/arena_polish.py'
      - 'blender/tree_artist.py'
      - '.github/workflows/stone-grass-arena-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rejustice-high-detail-v2-main
  cancel-in-progress: true

jobs:
  blender:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and preview utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy python3-pil
      - name: Verify Python build scripts
        run: |
          python3 -m py_compile blender/build_training_arena.py blender/arena_polish.py blender/tree_artist.py
      - name: Generate actual edit-ready Blender scene and embedded-texture GLB
        run: |
          mkdir -p assets/arena
          blender --background --factory-startup --python-exit-code 1 --python blender/build_training_arena.py > /tmp/rejustice-blender.log 2>&1 || (tail -130 /tmp/rejustice-blender.log && exit 1)
          tail -45 /tmp/rejustice-blender.log
          grep 'GRASS_QA' /tmp/rejustice-blender.log
          grep 'STONE_SLAB_WALL_QA' /tmp/rejustice-blender.log
          grep 'VERTICAL_WALL_QA' /tmp/rejustice-blender.log
          grep 'HIGH_DETAIL_TURF_QA' /tmp/rejustice-blender.log
          grep 'HIGH_DETAIL_GRASS_QA' /tmp/rejustice-blender.log
          grep 'HIGH_DETAIL_STONE_QA' /tmp/rejustice-blender.log
          grep 'HIGH_DETAIL_TREE_QA' /tmp/rejustice-blender.log
          grep 'HIGH_DETAIL_BARK_QA' /tmp/rejustice-blender.log
          grep 'TRAINING_GROUND_SUCCESS' /tmp/rejustice-blender.log
          test -s assets/arena/training-ground.glb
          test -s assets/arena/training-ground.blend
          test -s assets/arena/training-ground-preview.png
          test -s assets/arena/grass-turf.png
          test -s assets/arena/stone-grain.png
          test -s assets/arena/tree-bark-grain.png
          test -s assets/arena/training-wall-grass-detail.png
          test -s assets/arena/training-tree-detail.png
          test -s assets/arena/training-tree-trunk.png
      - name: Validate exported grass texture and actual stone materials
        run: |
          python3 - <<'PY'
          import json,struct
          from pathlib import Path
          glb=Path('assets/arena/training-ground.glb').read_bytes()
          assert glb[:4]==b'glTF' and len(glb)>100000
          n=struct.unpack_from('<I',glb,12)[0]
          assert glb[16:20]==b'JSON'
          data=json.loads(glb[20:20+n].decode('utf-8'))
          names=[m.get('name','') for m in data.get('materials',[])]
          assert any('GRASS' in x for x in names),names
          assert len([x for x in names if x.startswith('WALL VERTICAL | light limestone')])==4,names
          assert not any('medium gray stone' in x or 'sandstone' in x for x in names),names
          assert len(data.get('textures',[]))>=3 and len(data.get('images',[]))>=3, 'Grass, stone and bark textures missing'
          mat_images=[]
          for m in data['materials']:
            tex=m.get('pbrMetallicRoughness',{}).get('baseColorTexture')
            if tex:mat_images.append(m.get('name',''))
          assert 'Meadow turf | textured living grass' in mat_images,mat_images
          assert any(name.startswith('WALL VERTICAL | light limestone') for name in mat_images),mat_images
          assert any('chestnut bark' in name for name in mat_images),mat_images
          triangles=0
          for mesh in data['meshes']:
            for p in mesh.get('primitives',[]):
              acc=data['accessors'][p['indices']]
              triangles+=acc['count']//3
          assert triangles<1350000, f'Too many triangles for browser gameplay: {triangles}'
          assert len(glb)<44000000, f'Model too heavy for browser: {len(glb)}'
          print('PERFORMANCE_DETAIL_QA',triangles,'triangles',len(glb),'bytes')
          print('EXPORTED_VERTICAL_WALL_QA',len(glb),'bytes',
              len(data.get('materials',[])),'materials',
              len(data.get('textures',[])),'textures')
          PY
      - name: Prepare overhead and close-up visual QA previews
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import base64
          p=Path('assets/arena')
          for name in ['training-ground','training-tree-detail',
                       'training-tree-trunk','training-wall-grass-detail']:
            im=Image.open(p/(name+'-preview.png' if name=='training-ground' else name+'.png')).convert('RGB')
            im.thumbnail((960,640))
            im.save(p/(name+'-review.jpg'),quality=81,optimize=True)
            (p/(name+'-review.base64.txt')).write_text(
              base64.b64encode((p/(name+'-review.jpg')).read_bytes()).decode('ascii'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rejustice-stone-slab-grass-blender-source
          path: |
            assets/arena/training-ground.blend
            assets/arena/training-ground.glb
            assets/arena/training-ground-preview.png
            assets/arena/training-ground-review.jpg
            assets/arena/training-tree-detail.png
            assets/arena/training-tree-trunk.png
            assets/arena/training-wall-grass-detail.png
            assets/arena/grass-turf.png
            assets/arena/stone-grain.png
            assets/arena/tree-bark-grain.png
          retention-days: 30
      - name: Commit new Blender assets to live main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/new-arena
          cp assets/arena/training-ground.blend /tmp/new-arena/
          cp assets/arena/training-ground.glb /tmp/new-arena/
          cp assets/arena/training-ground-preview.png /tmp/new-arena/
          cp assets/arena/training-ground-review.jpg /tmp/new-arena/
          cp assets/arena/training-ground-review.base64.txt /tmp/new-arena/
          cp assets/arena/grass-turf.png /tmp/new-arena/
          cp assets/arena/stone-grain.png /tmp/new-arena/
          cp assets/arena/tree-bark-grain.png /tmp/new-arena/
          cp assets/arena/training-tree-detail.png /tmp/new-arena/
          cp assets/arena/training-tree-trunk.png /tmp/new-arena/
          cp assets/arena/training-wall-grass-detail.png /tmp/new-arena/
          cp assets/arena/training-tree-*-review.* /tmp/new-arena/
          cp assets/arena/training-wall-grass-detail-review.* /tmp/new-arena/
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/new-arena/* assets/arena/
          git add assets/arena/training-ground.blend assets/arena/training-ground.glb assets/arena/training-ground-preview.png assets/arena/training-ground-review.jpg assets/arena/training-ground-review.base64.txt
          git add assets/arena/grass-turf.png assets/arena/stone-grain.png assets/arena/tree-bark-grain.png
          git add assets/arena/training-tree-detail.png assets/arena/training-tree-trunk.png assets/arena/training-wall-grass-detail.png
          git add assets/arena/training-tree-*-review.* assets/arena/training-wall-grass-detail-review.*
          if ! git diff --cached --quiet; then
            git commit -m "Export higher-detail tree, stone slabs and meadow terrain [skip ci]"
            git push origin HEAD:main
          fi
