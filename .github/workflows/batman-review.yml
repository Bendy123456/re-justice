name: Prepare Batman inspection previews
on:
  push:
    branches: [batman-blender-asset]
    paths:
      - '.github/workflows/batman-review.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batman-blender-asset
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build small image previews for visual QA
        run: |
          python -m pip install pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import base64
          base=Path('generated/batman')
          for name in ['batman_fullbody','batman_armor_closeup']:
              src=base/(name+'.png')
              im=Image.open(src).convert('RGB')
              im.thumbnail((600,600))
              dst=base/(name+'_qa.jpg')
              im.save(dst,quality=73,optimize=True)
              (base/(name+'_qa.base64.txt')).write_text(base64.b64encode(dst.read_bytes()).decode('ascii'))
              print(name,im.size,dst.stat().st_size)
          PY
      - name: Commit lightweight image QA copies to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/batman/*_qa.jpg generated/batman/*_qa.base64.txt
          git commit -m "Add model inspection JPEGs and visual review payloads [skip ci]"
          git push origin HEAD:batman-blender-asset
