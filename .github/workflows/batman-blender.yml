name: Build editable Batman model
on:
  push:
    branches: [batman-blender-asset]
    paths:
      - 'blender/build_batman.py'
      - '.github/workflows/batman-blender.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-blend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: batman-blender-asset
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy
          blender --version
      - name: Build mesh rig and render review images
        run: |
          mkdir -p generated/batman
          blender --background --factory-startup --python-exit-code 1 --python blender/build_batman.py > generated/batman/build-log.txt 2>&1 || (tail -150 generated/batman/build-log.txt && exit 1)
          tail -35 generated/batman/build-log.txt
      - name: Validate exports
        run: |
          test -s generated/batman/REJustice_Batman_Study.blend
          test -s generated/batman/REJustice_Batman_Study.glb
          test -s generated/batman/batman_fullbody.png
          test -s generated/batman/batman_armor_closeup.png
          cat generated/batman/QA.txt
          ls -lh generated/batman
      - uses: actions/upload-artifact@v4
        with:
          name: batman-blender-asset
          path: generated/batman
          retention-days: 30
      - name: Save editable assets on preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/batman
          git commit -m "Batman modeling study: Blend, glTF and inspection renders [skip ci]"
          git push origin HEAD:batman-blender-asset
