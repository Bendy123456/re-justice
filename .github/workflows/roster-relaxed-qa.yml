name: RE-Justice relaxed roster preview QA
on:
  push:
    branches: [main]
    paths:
      - 'glb-visuals.js'
      - 'ui.js'
      - 'engine.js'
      - 'arena3d.js'
      - 'roster-preview-qa.mjs'
      - 'index.html'
      - '.github/workflows/roster-relaxed-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rejustice-roster-relaxed-qa
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and regression tests
        run: |
          node --check glb-visuals.js
          node --check ui.js
          node --check engine.js
          node --check arena3d.js
          node --check roster-preview-qa.mjs
          node smoke-tests.cjs
          node model-tests.cjs
      - name: Install headless Chromium for WebGL
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Test real Blender models in character select and combat
        run: |
          python3 -m http.server 8765 >/tmp/roster-qa.log 2>&1 &
          sleep 3
          node roster-preview-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rejustice-relaxed-roster-screenshots
          path: ci-images/*.png
          retention-days: 14
