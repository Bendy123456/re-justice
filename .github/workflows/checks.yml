name: RE-Justice checks
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check engine.js
          node --check ui.js
          node --check input.js
          node --check arena3d.js
          node --check arena-browser-qa.mjs
          node --check smoke-tests.cjs
      - name: Run combat, input, and menu regression tests
        run: node smoke-tests.cjs
