<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RE-Justice | Fighter Model Viewer</title>
<style>
:root{color-scheme:dark;font-family:Segoe UI,Arial,sans-serif}*{box-sizing:border-box}
body{margin:0;background:#060d16;color:#e9f2fa;display:grid;grid-template-columns:330px minmax(0,1fr);min-height:100dvh}
aside{padding:26px;border-right:1px solid #244054;background:#0b1725}main{padding:20px;min-width:0;display:flex;align-items:center;justify-content:center}
h1{font-size:23px;margin:8px 0 3px}p{color:#9cb8cc;line-height:1.5;font-size:13px;margin:0 0 18px}
label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#91b3c9;margin-top:17px;margin-bottom:7px}
select,input[type=range],button{width:100%}select,button{background:#12283b;border:1px solid #38546b;border-radius:8px;color:#e4f5ff;padding:11px;font:600 14px Segoe UI,Arial}
button{cursor:pointer;background:#245678;border-color:#66bbdf;margin-top:12px}button:hover{background:#31678d}
.checkbox{display:flex;align-items:center;gap:9px;padding:8px 0;font-size:14px;color:#c9deea;cursor:pointer}.checkbox input{accent-color:#68c7ed}
small{font-size:12px;color:#91b5cb}canvas{max-width:100%;width:100%;max-height:calc(100dvh - 40px);aspect-ratio:1280/720;border:1px solid #294358;border-radius:12px;background:#101b29}
#metric{margin-top:14px;font:600 12px monospace;line-height:1.8;color:#a4cadf;white-space:pre-wrap}
a{color:#83d3ee} @media(max-width:850px){body{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #244054}main{padding:8px}canvas{max-height:60vh}}
</style></head><body>
<aside>
<small>RE-JUSTICE / DEVELOPMENT TOOLS</small><h1>FIGHTER MODEL VIEWER</h1>
<p>Scrub the hand-keyframed 2D skeletal rig. This is a visual debug page; no combat mechanics are simulated.</p>
<label for="fighter">Character</label><select id="fighter"></select>
<label for="motion">Animation / pose</label><select id="motion"></select>
<label for="variant">Palette</label><select id="variant"><option value="0">Original</option><option value="1">Alternate 1</option></select>
<label for="frame">Frame <span id="frameText">0 / 120</span></label><input type="range" id="frame" min="0" max="120" step="1" value="0">
<button id="play">Pause Animation</button>
<div style="display:flex;gap:14px;margin-top:12px"><label class="checkbox"><input type="checkbox" id="skeleton">Skeleton</label><label class="checkbox"><input type="checkbox" id="hitboxes">Hitboxes</label></div>
<label class="checkbox"><input type="checkbox" id="flip">Face left</label>
<div id="metric"></div>
<p style="margin-top:25px"><a href="index.html">← Back to game</a></p>
</aside><main><canvas id="viewer" width="1280" height="720"></canvas></main>
<script src="characters.js"></script><script src="fighter-rig.js"></script><script src="model-viewer.js"></script>
</body></html>
